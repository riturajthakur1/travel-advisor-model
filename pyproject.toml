[project]
name = "travel-advisor-model"
version = "0.1.0"
description = "Fine-tuning Qwen3.5-0.8B into a CPU-friendly travel advisor"
requires-python = ">=3.12"
dependencies = [
    "fast-flights>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["travel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "pytest>=9.1.1",
    "transformers>=5",
]
